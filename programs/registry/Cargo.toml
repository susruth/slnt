[package]
name = "registry"
version = "0.1.0"
description = "Slnt Registry: maps Solana pubkeys to Slnt meta-addresses (used by the Slnt stealth-payment protocol)"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
