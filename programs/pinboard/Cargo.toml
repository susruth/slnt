[package]
name = "pinboard"
version = "0.1.0"
description = "Pinboard: a permissionless on-chain note primitive for Solana (used by the Slnt stealth-payment protocol)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pinboard"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
