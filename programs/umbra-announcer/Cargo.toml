[package]
name = "umbra-announcer"
version = "0.1.0"
description = "Umbra protocol announcer program for Solana stealth payments (v1)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "umbra_announcer"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
