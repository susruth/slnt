[package]
name = "slnt-announcer"
version = "0.1.0"
edition = "2021"
description = "Reference announcer (announcement service) for Slnt (sRFC-0042 §5.8.4)"
license = "Apache-2.0"

[[bin]]
name = "slnt-announcer"
path = "src/main.rs"

[dependencies]
slnt-sdk = { path = "../slnt-sdk" }
solana-sdk = "2.3"
solana-client = "2.3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
