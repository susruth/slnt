name: Feature request
description: Suggest a non-protocol feature or improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        If this changes protocol interoperability, open a GitHub Discussion first rather than an issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rust SDK
        - TypeScript SDK
        - CLI
        - announcer service
        - indexer service
        - docs
        - tests / tooling
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Security / privacy impact
      description: Note any fund-safety, key-recovery, or unlinkability implications.
